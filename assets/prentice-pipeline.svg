<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">The Prentice workflow</title>
  <desc id="description">Diagnose creates a confirmed evidence-linked tool brief. Construction starts only after an exact revision, authority holder, cost cap, and build owner are recorded. Commission then autonomously orchestrates harden, sequence, make, and snag before producing a working-tool handback and FIRE_IT_UP document. Without authorization, the case stops, enters evaluation, or is handed off.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#173332" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-muted" viewBox="0 0 8 8" refX="6.3" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#A9B4B1"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 8 8" refX="6.3" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#C47A22"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 8 8" refX="6.3" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#A9D5CE"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="756" height="428" rx="18" fill="#FBFAF7" stroke="#E3E6E1"/>
  <text x="22" y="35" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.6" fill="#77837F">THE PRENTICE WORKFLOW</text>
  <text x="738" y="35" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9AA4A1">diagnose first · construct only when authorized</text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, sans-serif">
    <rect x="22" y="59" width="170" height="72" rx="13" fill="#FFFFFF" stroke="#B9D5D0"/>
    <rect x="22" y="59" width="6" height="72" rx="3" fill="#16736F"/>
    <text x="42" y="82" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1" fill="#16736F">DISCOVERY</text>
    <text x="42" y="104" font-size="17" font-weight="720" fill="#142B2A">diagnose</text>
    <text x="42" y="121" font-size="10.5" fill="#74817E">learn the real workflow</text>

    <rect x="224" y="59" width="170" height="72" rx="13" fill="#FFFFFF" stroke="#D7DBD7"/>
    <text x="244" y="82" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1" fill="#77837F">CASE ARTIFACT</text>
    <text x="244" y="104" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="700" fill="#142B2A">TOOL_BRIEF.md</text>
    <text x="244" y="121" font-size="10.5" fill="#74817E">confirmed workflow account</text>

    <rect x="426" y="59" width="312" height="72" rx="13" fill="#FFF6E7" stroke="#DDA65B"/>
    <text x="446" y="82" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1" fill="#A65E13">BUILD GATE</text>
    <text x="446" y="103" font-size="14" font-weight="700" fill="#432D18">Exact revision authorized?</text>
    <text x="446" y="120" font-size="10.5" fill="#7D654D">authority holder · cost cap · named build owner</text>
  </g>

  <g stroke="#A9B4B1" stroke-width="1.6" fill="none">
    <path d="M196 95 H216" marker-end="url(#arrow-muted)"/>
    <path d="M398 95 H418" marker-end="url(#arrow-muted)"/>
  </g>

  <path d="M582 133 V164" stroke="#C47A22" stroke-width="1.7" fill="none" marker-end="url(#arrow-gold)"/>
  <text x="594" y="153" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.8" fill="#A65E13">YES</text>
  <path d="M426 117 H405 V151 H263" stroke="#C8CECB" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow-muted)"/>
  <text x="276" y="149" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8A9491">NO — stop · evaluate · hand off</text>

  <rect x="22" y="170" width="716" height="188" rx="17" fill="#153F3D"/>
  <text x="42" y="199" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.3" fill="#8CD0C7">AUTONOMOUS CONSTRUCTION ORCHESTRATOR</text>
  <text x="42" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="740" fill="#FFFFFF">commission</text>
  <text x="190" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#B7D2CE">invokes each phase and carries its artifact forward</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="42" y="243" width="146" height="74" rx="12" fill="#FFFFFF"/>
    <text x="58" y="264" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.8" fill="#5E7773">01 · DESIGN</text>
    <text x="58" y="287" font-size="16" font-weight="720" fill="#142B2A">harden</text>
    <text x="58" y="304" font-size="10.5" fill="#74817E">stress-test the brief</text>

    <rect x="218" y="243" width="146" height="74" rx="12" fill="#FFFFFF"/>
    <text x="234" y="264" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.8" fill="#5E7773">02 · PLAN</text>
    <text x="234" y="287" font-size="16" font-weight="720" fill="#142B2A">sequence</text>
    <text x="234" y="304" font-size="10.5" fill="#74817E">define verified units</text>

    <rect x="394" y="243" width="146" height="74" rx="12" fill="#FFFFFF"/>
    <text x="410" y="264" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.8" fill="#5E7773">03 · BUILD</text>
    <text x="410" y="287" font-size="16" font-weight="720" fill="#142B2A">make</text>
    <text x="410" y="304" font-size="10.5" fill="#74817E">construct + record checks</text>

    <rect x="570" y="243" width="146" height="74" rx="12" fill="#FFFFFF"/>
    <text x="586" y="264" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.8" fill="#5E7773">04 · DEFECT PASS</text>
    <text x="586" y="287" font-size="16" font-weight="720" fill="#142B2A">snag</text>
    <text x="586" y="304" font-size="10.5" fill="#74817E">audit · triage · fix</text>
  </g>

  <g stroke="#A9D5CE" stroke-width="1.6" fill="none">
    <path d="M192 280 H210" marker-end="url(#arrow-light)"/>
    <path d="M368 280 H386" marker-end="url(#arrow-light)"/>
    <path d="M544 280 H562" marker-end="url(#arrow-light)"/>
  </g>
  <text x="380" y="341" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9.5" fill="#9FC1BC">the orchestrator wraps the phases — it is not a fifth phase beneath them</text>

  <path d="M380 358 V372" stroke="#16736F" stroke-width="1.7" fill="none" marker-end="url(#arrow-muted)"/>
  <rect x="171" y="377" width="418" height="34" rx="17" fill="#E6F2F0" stroke="#8EBDB6"/>
  <text x="380" y="398" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#164E4A"><tspan font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-weight="700">FIRE_IT_UP.md</tspan><tspan> · working-tool aim · owner review · wiring tickets</tspan></text>
  <text x="380" y="424" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9.5" fill="#8A9491">confirmation ≠ evaluation ≠ build authorization ≠ adoption</text>
</svg>

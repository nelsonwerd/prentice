<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">The Prentice workflow</title>
  <desc id="description">A straight top-to-bottom workflow. Diagnose learns the real workflow and creates a confirmed evidence-linked tool brief. Construction starts only when one exact revision, authority holder, cost cap, and build owner are recorded. Commission then autonomously orchestrates harden, sequence, make, and snag. It hands back both a prototype or version one of the proposed build and FIRE_IT_UP.md, the start-up, review, and wiring handoff. Without build authorization, the case stops, enters evaluation, or is handed off.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#173332" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-muted" viewBox="0 0 8 8" refX="6.3" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9EAAA7"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 8 8" refX="6.3" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#C47A22"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 8 8" refX="6.3" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#A9D5CE"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="756" height="596" rx="18" fill="#FBFAF7" stroke="#E3E6E1"/>
  <text x="22" y="33" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.6" fill="#77837F">THE PRENTICE WORKFLOW</text>
  <text x="738" y="33" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9AA4A1">diagnose first · construct only when authorized</text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, sans-serif">
    <rect x="150" y="52" width="460" height="56" rx="13" fill="#FFFFFF" stroke="#B9D5D0"/>
    <rect x="150" y="52" width="6" height="56" rx="3" fill="#16736F"/>
    <text x="176" y="74" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1" fill="#16736F">01 · DISCOVERY</text>
    <text x="176" y="96" font-size="17" font-weight="720" fill="#142B2A">diagnose</text>
    <text x="278" y="96" font-size="11" fill="#74817E">learn the real workflow from evidence and correction</text>

    <rect x="150" y="128" width="460" height="56" rx="13" fill="#FFFFFF" stroke="#D7DBD7"/>
    <text x="176" y="150" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1" fill="#77837F">02 · CONFIRMED CASE</text>
    <text x="176" y="172" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="700" fill="#142B2A">TOOL_BRIEF.md</text>
    <text x="310" y="172" font-size="11" fill="#74817E">workflow · friction · intervention · handoffs · gates</text>

    <rect x="150" y="204" width="460" height="68" rx="13" fill="#FFF6E7" stroke="#DDA65B"/>
    <text x="176" y="226" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1" fill="#A65E13">03 · BUILD GATE</text>
    <text x="176" y="248" font-size="15" font-weight="720" fill="#432D18">Authorize exact revision?</text>
    <text x="176" y="264" font-size="10.5" fill="#7D654D">authority holder · cost cap · named build owner</text>
  </g>

  <g stroke="#9EAAA7" stroke-width="1.6" fill="none">
    <path d="M380 109 V121" marker-end="url(#arrow-muted)"/>
    <path d="M380 185 V197" marker-end="url(#arrow-muted)"/>
  </g>
  <path d="M380 273 V298" stroke="#C47A22" stroke-width="1.7" fill="none" marker-end="url(#arrow-gold)"/>
  <text x="176" y="291" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#A07953">NO → stop · evaluate · hand off</text>
  <text x="392" y="291" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.8" fill="#A65E13">AUTHORIZED</text>

  <rect x="22" y="304" width="716" height="180" rx="17" fill="#153F3D"/>
  <text x="42" y="331" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.3" fill="#8CD0C7">AUTONOMOUS CONSTRUCTION ORCHESTRATOR</text>
  <text x="42" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="740" fill="#FFFFFF">commission</text>
  <text x="190" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#B7D2CE">invokes each phase and carries its artifact forward</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="42" y="373" width="146" height="72" rx="12" fill="#FFFFFF"/>
    <text x="58" y="394" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.8" fill="#5E7773">01 · DESIGN</text>
    <text x="58" y="417" font-size="16" font-weight="720" fill="#142B2A">harden</text>
    <text x="58" y="434" font-size="10.5" fill="#74817E">stress-test design</text>

    <rect x="218" y="373" width="146" height="72" rx="12" fill="#FFFFFF"/>
    <text x="234" y="394" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.8" fill="#5E7773">02 · PLAN</text>
    <text x="234" y="417" font-size="16" font-weight="720" fill="#142B2A">sequence</text>
    <text x="234" y="434" font-size="10.5" fill="#74817E">plan build units</text>

    <rect x="394" y="373" width="146" height="72" rx="12" fill="#FFFFFF"/>
    <text x="410" y="394" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.8" fill="#5E7773">03 · BUILD</text>
    <text x="410" y="417" font-size="16" font-weight="720" fill="#142B2A">make</text>
    <text x="410" y="434" font-size="10.5" fill="#74817E">build + record checks</text>

    <rect x="570" y="373" width="146" height="72" rx="12" fill="#FFFFFF"/>
    <text x="586" y="394" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.8" fill="#5E7773">04 · DEFECT PASS</text>
    <text x="586" y="417" font-size="16" font-weight="720" fill="#142B2A">snag</text>
    <text x="586" y="434" font-size="10.5" fill="#74817E">audit · triage · fix</text>
  </g>

  <g stroke="#A9D5CE" stroke-width="1.6" fill="none">
    <path d="M192 409 H210" marker-end="url(#arrow-light)"/>
    <path d="M368 409 H386" marker-end="url(#arrow-light)"/>
    <path d="M544 409 H562" marker-end="url(#arrow-light)"/>
  </g>
  <text x="380" y="468" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9.5" fill="#9FC1BC">commission wraps the phases — it is not a fifth phase beneath them</text>

  <path d="M380 485 V502" stroke="#16736F" stroke-width="1.6" fill="none"/>
  <path d="M380 502 H235 V509" stroke="#16736F" stroke-width="1.6" fill="none" marker-end="url(#arrow-muted)"/>
  <path d="M380 502 H525 V509" stroke="#16736F" stroke-width="1.6" fill="none" marker-end="url(#arrow-muted)"/>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="100" y="515" width="270" height="50" rx="14" fill="#DFF0ED" stroke="#86BBB4"/>
    <text x="122" y="537" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="12.5" font-weight="700" fill="#164E4A">prototype / v1</text>
    <text x="122" y="554" font-size="9.5" fill="#52716D">the proposed build · owner review</text>

    <rect x="390" y="515" width="270" height="50" rx="14" fill="#F1F4F2" stroke="#BDC8C4"/>
    <text x="412" y="537" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="12.5" font-weight="700" fill="#324A47">FIRE_IT_UP.md</text>
    <text x="412" y="554" font-size="9.5" fill="#687A76">start-up · review · wiring handoff</text>
  </g>

  <text x="380" y="587" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9.5" fill="#8A9491">confirmation ≠ evaluation ≠ build authorization ≠ adoption</text>
</svg>
